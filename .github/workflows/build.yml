name: Alien Build & Release

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [created]
  workflow_dispatch:

# 顺应 2026 年新规，提前强制运行在 Node.js 24 环境下，消除警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    # 1. 拉取仓库代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 配置 .NET 环境（保持你的 C# 项目版本，此处以 8.0.x 为例）
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'   

    # 3. 还原 NuGet 依赖
    - name: Restore dependencies
      run: dotnet restore

    # 4. 单文件独立编译（Windows x64）
    - name: Publish (Self-Contained Single File)
      run: |
        dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -o ./publish

    # 5. 使用 PowerShell 打包压缩包
    - name: Archive Artifacts
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./Alien-win-x64.zip

    # 6. 计算 SHA-256 校验码
    - name: Generate SHA256
      shell: pwsh
      run: |
        (Get-FileHash ./Alien-win-x64.zip -Algorithm SHA256).Hash.ToLower() + "  Alien-win-x64.zip" > ./Alien-win-x64.zip.sha256

    # 场景 A：日常提交，上传到 Actions Artifacts
    - name: Upload Temporary Artifacts
      uses: actions/upload-artifact@v4
      if: github.event_name != 'release'
      with:
        name: Alien-Windows-x64
        path: |
          ./Alien-win-x64.zip
          ./Alien-win-x64.zip.sha256

    # 场景 B：正式 Release 发布，挂载至 Release Assets
    - name: Upload Binaries to Release Assets
      uses: softprops/action-gh-release@v2
      if: github.event_name == 'release'
      with:
        files: |
          ./Alien-win-x64.zip
          ./Alien-win-x64.zip.sha256
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
