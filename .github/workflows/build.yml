name: Alien Auto Build & Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    # 1. 拉取仓库代码
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. 配置 .NET 环境
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'   

    # 3. 还原 NuGet 依赖
    - name: Restore dependencies
      run: dotnet restore

    # 4. 单文件独立编译（精准修正版）
    # 修复 A：传入 -p:Nullable=disable 在编译时动态关闭可空检查，允许 null 赋值
    # 修复 B：将解决方案打包改为精准指定主项目文件夹（./Alien），解决 --output 冲突
    - name: Publish (Self-Contained Single File)
      run: |
        dotnet publish ./Alien -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:Nullable=disable -o ./publish

    # 5. 使用 PowerShell 打包压缩包
    - name: Archive Artifacts
      shell: pwsh
      run: |
        Compress-Archive -Path ./publish/* -DestinationPath ./Alien-win-x64.zip

    # 6. 计算 SHA-256 校验码
    - name: Generate SHA256
      shell: pwsh
      run: |
        (Get-FileHash ./Alien-win-x64.zip -Algorithm SHA256).Hash.ToLower() + "  Alien-win-x64.zip" > ./Alien-win-x64.zip.sha256

    # 7. 生成自动化动态版本号
    - name: Generate Tag Name
      id: tag
      shell: pwsh
      run: |
        $date = Get-Date -Format "yyyy.MM.dd"
        $sha = "${{ github.sha }}".Substring(0, 7)
        echo "version=v${date}-${sha}" >> $env:GITHUB_OUTPUT

    # 8. 全自动创建 Release 并挂载产物
    - name: Create Release & Upload Assets
      uses: ncipollo/release-action@v1
      with:
        artifacts: "./Alien-win-x64.zip,./Alien-win-x64.zip.sha256"
        tag: ${{ steps.tag.outputs.version }}
        name: "Alien Auto Release ${{ steps.tag.outputs.version }}"
        body: |
          ### 🚀 自动化构建成功通知
          本版本由 GitHub Actions 全自动编译生成。
          
          - **提交分支:** `${{ github.ref_name }}`
          - **Commit SHA:** [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})
          - **编译时间:** ${{ steps.tag.outputs.version }}
          
          *请在下方下载对应的 `win-x64` 免安装独立版及哈希校验文件。*
        token: ${{ secrets.GITHUB_TOKEN }}
